apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: autocomplete-service-alerts
  namespace: autocomplete
  labels:
    app: autocomplete
    prometheus: k8s
    role: alert-rules
spec:
  groups:
  - name: autocomplete.rules
    rules:
    - alert: AutocompleteServiceHighLatency
      annotations:
        summary: High latency in autocomplete service
        description: 95th percentile of request duration is above 2 seconds for more than 5 minutes.
        runbook_url: https://docs.example.com/autocomplete-latency
      expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{service="autocomplete"}[5m])) by (le, service)) > 2
      for: 5m
      labels:
        severity: warning
        team: ops
        service: autocomplete

    - alert: AutocompleteServiceHighErrorRate
      annotations:
        summary: High error rate in autocomplete service
        description: Error rate is above 5% for more than 3 minutes.
        runbook_url: https://docs.example.com/autocomplete-errors
      expr: sum(rate(http_requests_total{service="autocomplete", status_code=~"5.."}[5m])) / sum(rate(http_requests_total{service="autocomplete"}[5m])) > 0.05
      for: 3m
      labels:
        severity: critical
        team: ops
        service: autocomplete

    - alert: AutocompleteServiceHighCPUUsage
      annotations:
        summary: High CPU usage in autocomplete service
        description: CPU usage is above 85% of the limit for more than 10 minutes.
        runbook_url: https://docs.example.com/autocomplete-cpu
      expr: sum(rate(container_cpu_usage_seconds_total{namespace="autocomplete", pod=~"autocomplete-.*"}[5m])) / sum(kube_pod_container_resource_limits_cpu_cores{namespace="autocomplete", pod=~"autocomplete-.*"}) > 0.85
      for: 10m
      labels:
        severity: warning
        team: ops
        service: autocomplete

    - alert: AutocompleteServiceHighMemoryUsage
      annotations:
        summary: High memory usage in autocomplete service
        description: Memory usage is above 85% of the limit for more than 10 minutes.
        runbook_url: https://docs.example.com/autocomplete-memory
      expr: sum(container_memory_usage_bytes{namespace="autocomplete", pod=~"autocomplete-.*"}) / sum(kube_pod_container_resource_limits_memory_bytes{namespace="autocomplete", pod=~"autocomplete-.*"}) > 0.85
      for: 10m
      labels:
        severity: warning
        team: ops
        service: autocomplete

    - alert: OpenSearchRedStatus
      annotations:
        summary: OpenSearch used by autocomplete service is RED
        description: OpenSearch status for autocomplete is RED
        runbook_url: https://docs.example.com/opensearch-status
      expr: aws_es_cluster_status_red_maximum{dimension_DomainName=~".*autocomplete.*"} > 0
      for: 5m
      labels:
        severity: critical
        team: ops
        service: autocomplete

    - alert: ALB5xxErrorsHighCriticalPercentage
      annotations:
        summary: ALB 5xx Errors Percentage High
        description: The number of 5xx errors from the ALB target group is high > 2%.
        runbook_url: https://docs.example.com/alb-errors
      expr: increase(aws_applicationelb_httpcode_target_5_xx_count_sum{dimension_TargetGroup=~".*autocomplete.*"}[1m]) / increase(aws_applicationelb_request_count_per_target_sum{dimension_TargetGroup=~".*autocomplete.*"}[1m]) * 100 > 2
      for: 5m
      labels:
        severity: critical
        team: ops
        service: autocomplete