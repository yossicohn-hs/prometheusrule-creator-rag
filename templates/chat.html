<!DOCTYPE html>
<html data-theme="dark">
<head>
    <title>PrometheusRule Generator</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root[data-theme="light"] {
            --bg-color: #ffffff;
            --text-color: #333333;
            --chat-bg: #ffffff;
            --chat-border: #ccc;
            --user-message-bg: #DCF8C6;
            --assistant-message-bg: #F1F0F0;
            --input-bg: #ffffff;
            --pre-bg: #f5f5f5;
        }

        :root[data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
            --chat-bg: #2d2d2d;
            --chat-border: #404040;
            --user-message-bg: #2e4a3d;
            --assistant-message-bg: #383838;
            --input-bg: #2d2d2d;
            --pre-bg: #383838;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: Arial, sans-serif;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }
        
        #chat-container {
            background-color: var(--chat-bg);
            border: 1px solid var(--chat-border);
            border-radius: 5px;
            height: 600px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
        }
        
        .message {
            margin-bottom: 10px;
            padding: 8px 15px;
            border-radius: 18px;
            max-width: 70%;
        }
        
        .user-message {
            background-color: var(--user-message-bg);
            align-self: flex-end;
            margin-left: auto;
        }
        
        .assistant-message {
            background-color: var(--assistant-message-bg);
        }
        
        #message-form {
            display: flex;
        }
        
        #message-input {
            flex-grow: 1;
            padding: 10px;
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-right: 10px;
        }
        
        button {
            padding: 10px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            background-color: var(--pre-bg);
            color: var(--text-color);
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        
        #prometheus-rule {
            margin-top: 20px;
            display: none;
        }

        .theme-switch {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
        }

        .theme-switch label {
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="theme-switch">
        <label for="theme-toggle">🌙 Dark Mode</label>
        <input type="checkbox" id="theme-toggle">
    </div>

    <h1>PrometheusRule Generator</h1>
    <p>Describe your service and I'll help you create a PrometheusRule.</p>
    
    <div id="chat-container"></div>
    
    <form id="message-form">
        <input type="text" id="message-input" placeholder="Type your message here..." autocomplete="off">
        <button type="submit">Send</button>
    </form>
    
    <div id="prometheus-rule">
        <h2>Generated PrometheusRule</h2>
        <pre id="rule-content"></pre>
        <button id="copy-rule">Copy to clipboard</button>
    </div>
    
    <div class="button-container">
        <button id="new-session-btn">Start New Session</button>
        <button id="clear-session-btn">Clear Current Session</button>
        <button id="simulator-btn">Run Simulator</button>
    </div>

    <script>
        // Store the session ID
        let sessionId = null;
        
        const themeToggle = document.getElementById('theme-toggle');
        
        // Check for saved theme preference or default to 'dark'
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeToggle.checked = savedTheme === 'dark';

        // Theme toggle handler
        themeToggle.addEventListener('change', (e) => {
            const theme = e.target.checked ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        });

        // Elements
        const chatContainer = document.getElementById('chat-container');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');
        const prometheusRuleSection = document.getElementById('prometheus-rule');
        const ruleContent = document.getElementById('rule-content');
        const copyRuleButton = document.getElementById('copy-rule');
        
        // Add a message to the chat
        function addMessage(content, isUser) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;
            
            // Handle markdown code blocks
            if (!isUser && content.includes('```')) {
                // Split by code blocks
                const parts = content.split(/```(?:yaml)?/);
                
                for (let i = 0; i < parts.length; i++) {
                    if (i % 2 === 0) {
                        // Regular text
                        if (parts[i].trim()) {
                            const textNode = document.createElement('p');
                            textNode.textContent = parts[i].trim();
                            messageDiv.appendChild(textNode);
                        }
                    } else {
                        // Code block
                        const preNode = document.createElement('pre');
                        preNode.textContent = parts[i].trim();
                        messageDiv.appendChild(preNode);
                    }
                }
            } else {
                messageDiv.textContent = content;
            }
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        // Submit the form
        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const message = messageInput.value.trim();
            if (!message) return;
            
            // Add user message to chat
            addMessage(message, true);
            messageInput.value = '';
            
            try {
                // Send message to API
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId
                    })
                });
                
                const data = await response.json();
                
                // Update session ID
                sessionId = data.session_id;
                
                // Add assistant message to chat
                if (data.complete==false) {
                    addMessage(data.message, false);
                }else{
                    addMessage("Based on the information you've provided, I've created a PrometheusRule for your service:", false);
                }
                
                // Show PrometheusRule if complete
                if (data.complete && data.prometheus_rule) {
                    prometheusRuleSection.style.display = 'block';
                    ruleContent.textContent = data.prometheus_rule;
                }
                
            } catch (error) {
                console.error('Error:', error);
                addMessage('An error occurred. Please try again.', false);
            }
        });
        
        // Copy PrometheusRule to clipboard
        copyRuleButton.addEventListener('click', () => {
            navigator.clipboard.writeText(ruleContent.textContent)
                .then(() => {
                    alert('PrometheusRule copied to clipboard!');
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                    alert('Failed to copy. Please select the text manually.');
                });
        });
        
        // Initial greeting
        addMessage('Hello!', false);
        addMessage('I can help you create a PrometheusRule for monitoring your Kubernetes service.', false);
        addMessage('Please describe your service.', false);
  
        let currentSessionId = sessionId;

        document.getElementById("new-session-btn").addEventListener("click", async () => {
            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "", session_id: null }),
                });
                const data = await response.json();
                currentSessionId = sessionId;
                alert(`New session started with ID: ${currentSessionId}`);
            } catch (error) {
                console.error("Error starting new session:", error);
            }
        });

        document.getElementById("clear-session-btn").addEventListener("click", async () => {
            if (!sessionId) {
                alert("No session to clear.");
                return;
            }
            try {
                const response = await fetch(`/api/session/${sessionId}`, {
                    method: "DELETE",
                });
                if (response.ok) {
                    alert(`Session ${sessionId} cleared successfully.`);
                    sessionId = null;
                    prometheusRuleSection.style.display = 'none'; // Hide PrometheusRule section
                    chatContainer.innerHTML = ''; // Clear chat messages
                } else {
                    const errorData = await response.json();
                    alert(`Error clearing session: ${errorData.detail}`);
                }
            } catch (error) {
                console.error("Error clearing session:", error);
            }
        });

        // Add simulation functionality
        let simulationRunning = false;
        const simulatorButton = document.getElementById('simulator-btn');
        
        async function runSimulation() {
    
            
            simulationRunning = true;
            simulatorButton.textContent = 'Stop Simulator';
            
            try {
                var starting = true;
                while (simulationRunning) {
                    // Step 1: Get simulated user response
                    
                    
                    if (starting) {
                        var sessionId = "1";
                        var message = "Hi Developer tell me about your Service";
                        addMessage("Simulating user input...", false);
                    }else{

                    }
                    const userResponse = await fetch('/api/simul/user', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: message, session_id: sessionId })
                    });
                    starting = false;
                    const userData = await userResponse.json();
                    sessionId = userData.session_id;
                    addMessage(userData.message, true);
                    
                    // Slight pause for visual effect
                    await new Promise(resolve => setTimeout(resolve, 1000));
                    
                    // Step 2: Get LLM response to user message
                    const llmResponse = await fetch('/api/simul/llm', {
                        method: 'POST', 
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            message: userData.message, 
                            session_id: sessionId 
                        })
                    });
                    
                    const llmData = await llmResponse.json();
                    addMessage(llmData.message, false);
                    message = llmData.message;
                    // Display PrometheusRule if available
                    if (llmData.complete && llmData.prometheus_rule) {
                        prometheusRuleSection.style.display = 'block';
                        ruleContent.textContent = llmData.prometheus_rule;
                        
                        // Stop simulation if we've reached completion
                        simulationRunning = false;
                        simulatorButton.textContent = 'Run Simulator';
                        break;
                    }
                    
                    // Pause between exchanges
                    await new Promise(resolve => setTimeout(resolve, 2000));
                }
            } catch (error) {
                console.error('Simulation error:', error);
                addMessage('Simulation error occurred. Please try again.', false);
                simulationRunning = false;
                simulatorButton.textContent = 'Run Simulator';
            }
        }
        
        simulatorButton.addEventListener('click', function() {
            if (simulationRunning) {
                // Stop simulation
                simulationRunning = false;
                simulatorButton.textContent = 'Run Simulator';
            } else {
                // Start simulation
                runSimulation();
            }
        });
    </script>
</body>
</html>
